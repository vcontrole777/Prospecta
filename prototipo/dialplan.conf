; ============================================================================
;  PROTÓTIPO — ticket #10 (Fluxo da URA no dialplan)
;  Descartável. NÃO é o desenho final: o sistema real conduz a chamada por
;  FastAGI (decisão do #4). Aqui é dialplan puro de propósito, para responder
;  as perguntas do caminho de áudio sem depender do FastAGI existir.
;
;  Asterisk 22.10.1 · Ubuntu 24.04 LTS
; ============================================================================

; ----------------------------------------------------------------------------
;  Como rodar
;
;  1. Incluir este arquivo no extensions.conf
;  2. Colocar os áudios em /var/lib/asterisk/sounds/prospecta/
;       espera.alaw    — tocado DURANTE o AMD (10º argumento). Obrigatório:
;                        sem ele o Lead ouve 1–5s de silêncio absoluto.
;       mensagem.alaw  — a Mensagem. Longa o suficiente para testar barge-in.
;       optin.alaw / optout.alaw / naoentendi.alaw
;  3. Originar pelo AMI, passando VARIANTE:
;
;     Action: Originate
;     Channel: PJSIP/99901SEUNUMERO@tronco
;     Context: prospecta-proto
;     Exten: s
;     Priority: 1
;     Async: true
;     Variable: VARIANTE=completo
;
;     VARIANTE aceita: completo | sem-amd | sem-silence
;       completo     — AMD + WaitForSilence + Mensagem   (o desenho proposto)
;       sem-amd      — só Mensagem                        (mede o ar morto do AMD)
;       sem-silence  — AMD + Mensagem, sem WaitForSilence (mede o efeito dele)
;
;  Rodar as três variantes contra os MESMOS números é o desenho experimental:
;  a diferença entre elas isola o custo de cada etapa.
; ----------------------------------------------------------------------------

[prospecta-proto]

exten => s,1,NoOp(=== PROTOTIPO #10 · variante=${VARIANTE} ===)
 same => n,Set(CHANNEL(hangup_handler_push)=prospecta-proto-h,s,1)
 same => n,Answer()

 ; Gravação a partir do ANSWER. Serve a dois propósitos aqui:
 ; ouvir o que o Lead ouviu, e ouvir uma amostra do que o AMD chamou de
 ; MÁQUINA — que é a ÚNICA forma de medir falso positivo (ver #4).
 ; SEM a opção 'b'. MEDIDO: 'b' significa "só gravar enquanto o canal
 ; estiver em ponte", e nesta chamada NUNCA há ponte — é uma perna só,
 ; que atende, toca áudio e lê tecla. Com 'b' o arquivo sai com 44 bytes
 ; (só cabeçalho WAV) enquanto o AMD claramente tem áudio para analisar.
 same => n,MixMonitor(proto-${UNIQUEID}.wav)

 same => n,Set(CDR(p_variante)=${VARIANTE})
 same => n,GotoIf($["${VARIANTE}" = "sem-amd"]?mensagem)

 ; ---- Pós-atendimento -----------------------------------------------------
 ; Valores contra o padrão: greeting 2200 (era 1500) e maxWords 3 (era 2).
 ; HIPÓTESE NÃO VERIFICADA: caixa postal de celular BR começa a falar de
 ; imediato, sem silêncio inicial, então o peso cai em greeting/maxWords em
 ; vez de INITIALSILENCE. A distribuição de AMDCAUSE abaixo é o que testa isso.
 ;
 ; Ordem posicional (confirmada na doc):
 ;   initialSilence, greeting, afterGreetingSilence, totalAnalysisTime,
 ;   miniumWordLength, betweenWordSilence, maximumNumberOfWords,
 ;   silenceThreshold, maximumWordLength, audioFile
 ; PARÂMETROS VALIDADOS EM CHAMADA REAL — 2026-08-09. Não mexer sem medir.
 ;
 ; O movimento que importa NÃO é um número, é a RELAÇÃO entre dois:
 ;   initialSilence (6000) > totalAnalysisTime (5000)
 ; Assim a regra de silêncio inicial NUNCA dispara. Isso importa porque
 ; atendimento automático começa a falar em 0 s, então initialSilence
 ; disparando significa quase sempre HUMANO ESPERANDO — e atender calado
 ; é normal em chamada de número desconhecido. Com a regra desabilitada,
 ; esse caso cai em NOTSURE, que este dialplan já trata como humano.
 ;
 ; Confirmado por predição declarada antes da chamada:
 ;   atendeu e ficou no mudo -> NOTSURE / TOOLONG-5000   (antes: MACHINE)
 ;   atendeu e falou         -> HUMAN / HUMAN-800-800
 ;   saudação de ~11 s       -> MACHINE por greeting
 ;
 ; greeting 4000: a saudação automática medida durou ~11 s contínuos, então
 ; 4000 pega com folga de 2,7x sem punir quem fala um pouco mais.
 ; afterGreetingSilence 800: pausas humanas medidas foram de 1–2 s.
 ; totalAnalysisTime 5000: é o TETO DO AR MORTO que o Lead ouve.
 ;
 ; ATENÇÃO: subir o greeting sozinho NÃO resolve. A versão anterior
 ; (2500,4500,800,8000) ainda classificava humano calado como MÁQUINA,
 ; porque 2500 < 8000 e a regra disparava aos 2,5 s.
 ; ABERTURA antes do AMD — VALIDADA em chamada real 2026-08-09.
 ; Dois propósitos: eliminar o ar morto que o Lead ouviria durante a
 ; análise, e provocar a fala de quem atendeu calado.
 ;
 ; Checagem de segurança feita: com a linha comprovadamente muda, o
 ; veredito continuou NOTSURE / TOOLONG-5000 — a abertura NÃO entra na
 ; janela que o AMD analisa. E quem atendeu confirmou ter OUVIDO o áudio,
 ; então ele chega ao Lead, não só ao log.
 ;
 ; Trocar 'hello' pelo áudio definitivo, curto (~1 s). Se o áudio novo for
 ; mais longo, REFAZER a checagem: abertura que invada a janela de análise
 ; faz o AMD classificar o nosso próprio som.
 same => n,Playback(prospecta/abertura)
 ; MEDIDO: Playback em arquivo ausente devolve FAILED e o dialplan CONTINUA.
 ; O Lead ouviria silêncio e o fluxo seguiria como se tudo estivesse bem.
 same => n,GotoIf($["${PLAYBACKSTATUS}" != "SUCCESS"]?audio-faltando)
 same => n,AMD(6000,4000,800,5000,100,50,3,256,5000)
 same => n,Set(CDR(p_amdstatus)=${AMDSTATUS})
 same => n,Set(CDR(p_amdcause)=${AMDCAUSE})
 same => n,NoOp(AMD: status=${AMDSTATUS} cause=${AMDCAUSE})

 same => n,GotoIf($["${AMDSTATUS}" = "HANGUP"]?fim)
 same => n,GotoIf($["${AMDSTATUS}" = "MACHINE"]?maquina)

 ; NOTSURE segue como HUMANO de propósito: falso-MÁQUINA é o erro caro,
 ; porque derruba na cara de quem atendeu e não gera erro nenhum no log.

 same => n,GotoIf($["${VARIANTE}" = "sem-silence"]?mensagem)

 ; ---- Espera o Lead terminar de falar --------------------------------------
 ; O AMD decide HUMANO assim que ouve uma palavra + 800ms. A pessoa disse
 ; "alô?" e pode estar prestes a dizer "quem fala?" — sem isto a Mensagem
 ; começa em cima dela.
 ; ATENÇÃO: silencerequired em MILISSEGUNDOS, timeout em SEGUNDOS.
 same => n,WaitForSilence(500,1,2)
 same => n,Set(CDR(p_waitstatus)=${WAITSTATUS})
 same => n,NoOp(WaitForSilence: ${WAITSTATUS})

 ; ---- Mensagem com barge-in ------------------------------------------------
 ; Read() corta o áudio no frame em que o dígito chega (verificado no fonte:
 ; ast_readstring_full usa AST_DIGIT_ANY + ast_stopstream).
 ; Read(var, arquivo, maxdigits, options, attempts, timeout_em_segundos)
 same => n(mensagem),Read(TECLA,prospecta/mensagem,1,,1,8)
 same => n,Set(CDR(p_readstatus)=${READSTATUS})
 same => n,Set(CDR(p_tecla)=${TECLA})
 same => n,NoOp(Read: status=${READSTATUS} tecla=${TECLA})

 same => n,GotoIf($["${TECLA}" = "1"]?optin)
 same => n,GotoIf($["${TECLA}" = "9"]?optout)
 same => n,Goto(naoentendi)

 ; ---- Opt-in ---------------------------------------------------------------
 ; A ação dispara AQUI, no instante da tecla — antes do áudio de confirmação
 ; (decisão do #6). No protótipo é só um NoOp marcando o instante.
 same => n(optin),NoOp(*** OPT-IN — a Ação dispararia agora ***)
 same => n,Set(CDR(p_desfecho)=opt_in)
 same => n,Playback(prospecta/optin)
 same => n,GotoIf($["${PLAYBACKSTATUS}" != "SUCCESS"]?audio-faltando)
 same => n,Goto(fim)

 same => n(optout),NoOp(*** OPT-OUT — entraria na Lista de bloqueio ***)
 same => n,Set(CDR(p_desfecho)=opt_out)
 same => n,Playback(prospecta/optout)
 same => n,GotoIf($["${PLAYBACKSTATUS}" != "SUCCESS"]?audio-faltando)
 same => n,Goto(fim)

 ; Tecla inválida ou silêncio: prompt curto, não a Mensagem inteira.
 same => n(naoentendi),Set(CDR(p_desfecho)=sem_resposta)
 same => n,Read(TECLA2,prospecta/naoentendi,1,,1,6)
 same => n,Set(CDR(p_tecla2)=${TECLA2})
 same => n,GotoIf($["${TECLA2}" = "1"]?optin)
 same => n,GotoIf($["${TECLA2}" = "9"]?optout)
 same => n,Goto(fim)

 same => n(maquina),NoOp(*** MÁQUINA — desliga e reagenda, sem deixar recado ***)
 same => n,Set(CDR(p_desfecho)=maquina)
 same => n,Goto(fim)

 same => n(fim),Hangup()

; ----------------------------------------------------------------------------
;  Hangup handler — captura a causa mesmo quando o fluxo não completa.
;  HANGUPCAUSE(channel,tech) é o código da tecnologia (SIP); (channel,ast) é
;  o código Asterisk. O Pré-atendimento do sistema real depende do TECHCAUSE
;  no evento AMI Hangup — aqui registramos o equivalente do lado do dialplan
;  para poder comparar as duas fontes.
; ----------------------------------------------------------------------------
; ---- Áudio de sistema faltando -------------------------------------------
; Desfecho NOMEADO em vez de silêncio. Isto não deveria acontecer: o
; provisionamento falha se os áudios não estiverem instalados, e o formato é
; conferido lá. Se chegar aqui, algo removeu ou corrompeu o arquivo depois.
exten => s,n(audio-faltando),Set(CDR(p_erro)=AUDIO_MISSING)
 same => n,Log(ERROR, AUDIO_MISSING — arquivo de sistema ausente ou ilegível)
 same => n,Hangup()

[prospecta-proto-h]
exten => s,1,NoOp(=== HANGUP ===)
 same => n,Set(CDR(p_hangup_ast)=${HANGUPCAUSE(${CHANNEL},ast)})
 same => n,Set(CDR(p_hangup_tech)=${HANGUPCAUSE(${CHANNEL},tech)})
 same => n,NoOp(HANGUPCAUSE ast=${HANGUPCAUSE(${CHANNEL},ast)} tech=${HANGUPCAUSE(${CHANNEL},tech)})
 same => n,Return()
