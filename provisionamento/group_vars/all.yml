---
# Versões e padrões — iguais em toda instância.
# Mudar aqui e reexecutar o playbook é o mecanismo de atualização.

php_versao: "8.4"
mysql_serie: "8.4"          # 8.0 saiu de suporte upstream em 2026-04-21
asterisk_versao: "22.10.1"  # LTS; piso 22.7.0 por causa de TechCause no DialEnd

# Onde o pacote gerado por build-asterisk.sh está publicado.
# Não versionamos o artefato neste repositório.
asterisk_url_artefato: "https://ARTEFATOS.EXEMPLO/asterisk_{{ asterisk_versao }}_amd64.deb"

# Chave do repositório do MySQL.
#
# A Oracle renova a expiração e republica com o ANO no nome, mantendo a
# mesma impressão digital (BCA4 3417 C3B4 85DD 128E C6D4 B7B3 B788 A8D3 785C).
#
# VERIFICADO: a chave -2023 expirou em 2025-10-22 e o apt recusa o
# repositório com EXPKEYSIG. A -2025 vale até 2027-10-23.
#
# Quando o provisionamento falhar com EXPKEYSIG, o conserto é subir o ano
# aqui — não é comprometimento de chave.
mysql_chave_url: https://repo.mysql.com/RPM-GPG-KEY-mysql-2025
mysql_chave_expira: "2027-10-23"

app_dir: /opt/prospecta
app_usuario: prospecta

# Banco. O NOME e o USUÁRIO são iguais em toda instância; a senha é por cliente e
# vive em host_vars, fora do git.
# Usuário do nginx. Só aparece na propriedade do SOCKET do php-fpm: é quem
# conecta nele, e não quem executa o PHP. Ver a task do pool em site.yml.
nginx_usuario: www-data

banco_nome: prospecta
banco_usuario: prospecta

# Artefato do código, montado na máquina de controle e enviado. `tar` +
# `unarchive` porque esta instalação só tem ansible.builtin — nem
# community.general nem ansible.posix — então `synchronize` não é opção.
artefato_local: /tmp/prospecta-artefato.tar.gz

# 🔴 HTTPS só existe se `dominio` for um NOME. Let's Encrypt não emite
# certificado para IP nu, e uma instância acessada por IP roda em HTTP.
#
# Isso muda duas coisas no .env, e a segunda é uma armadilha cruel:
# `SESSION_SECURE_COOKIE=true` sobre HTTP faz o navegador NUNCA enviar o cookie de
# sessão — o login parece dar certo e volta ao formulário, para sempre, sem uma
# linha de erro em lugar nenhum. Já custou tarde de gente em outros projetos.
#
# O teste é "tem letra": nome de domínio sempre tem, IPv4 nunca.
https_ativo: "{{ dominio is search('[a-zA-Z]') }}"

audio_dir: /var/lib/asterisk/sounds/prospecta

# Áudios de SISTEMA do produto, em pt-BR. Nenhum embutido do Asterisk chega
# ao Lead — voz de sistema no meio da Campanha soa como outra pessoa falando.
# Formato obrigatório: 8000 Hz, mono, alaw (casa com o codec do tronco).
# `abertura` tem limite duro de ~1 s: mais que isso invade a janela do AMD.
audios_sistema:
  - abertura
  - naoentendi
gravacao_dir: /var/spool/asterisk/gravacoes

# Gravação: GSM é ~10x menor que WAV. 200 canais em WAV são 41 GB/dia
# contra 4,3 GB/dia em GSM. "Gravar tudo" só é sustentável comprimido.
gravacao_formato: gsm
gravacao_retencao_dias: 30

# FastAGI por ativação de socket do systemd.
fastagi_porta: 4573
fastagi_host: 127.0.0.1
fastagi_max_conexoes: 512   # o PADRÃO do systemd é 64 — ver comentário na unidade

# Faixa de RTP. Dimensione para o número de canais contratados com folga.
rtp_porta_inicio: 10000
rtp_porta_fim: 20000

php_extensoes:
  - cli
  - fpm
  - mysql
  - mbstring
  - xml
  - curl
  - zip
  - intl
  - bcmath
  - opcache
