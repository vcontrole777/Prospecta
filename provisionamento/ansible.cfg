[defaults]
inventory = inventario.yml
interpreter_python = auto_silent
host_key_checking = True
# NÃO usar stdout_callback = yaml: esse callback vive na coleção
# community.general, e este playbook é feito para rodar com ansible-core
# puro, sem coleção nenhuma instalada. Verificado na prática — falha com
# "Invalid callback for stdout specified: yaml".
retry_files_enabled = False
roles_path = roles

[ssh_connection]
pipelining = True
