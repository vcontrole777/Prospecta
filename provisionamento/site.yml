---
- name: Provisionar e convergir uma instância do Prospecta
  hosts: todos
  become: true

  tasks:

    # ------------------------------------------------------------------
    - name: Base
      tags: [base]
      block:

        - name: Pacotes de base
          ansible.builtin.apt:
            name:
              - ca-certificates
              - curl
              - gnupg
              - nginx
              - sox
              - ffmpeg
            state: present
            update_cache: true

        - name: Usuário da aplicação
          ansible.builtin.user:
            name: "{{ app_usuario }}"
            system: true
            shell: /usr/sbin/nologin
            home: "{{ app_dir }}"
            create_home: false

        - name: Diretório de chaves de repositório
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

    # ------------------------------------------------------------------
    # PHP vem do PPA ondrej/php, NÃO do Sury.
    # Sury é o repositório Debian; no Ubuntu o equivalente do mesmo
    # mantenedor (Ondřej Surý) é este PPA. O ticket #23 e o ADR-0004
    # diziam "Sury" e foram corrigidos.
    - name: PHP {{ php_versao }}
      tags: [php]
      block:

        - name: Repositório do PHP
          ansible.builtin.apt_repository:
            repo: "ppa:ondrej/php"
            state: present
            update_cache: true

        - name: Pacotes do PHP
          ansible.builtin.apt:
            name: "{{ php_extensoes | map('regex_replace', '^', 'php' + php_versao + '-') | list }}"
            state: present

    # ------------------------------------------------------------------
    # O Ubuntu 24.04 empacota MySQL 8.0, que saiu de suporte upstream.
    # 8.4 vem do repositório da Oracle.
    #
    # VERIFICADO em execução real. Dois pontos de atrito descobertos:
    #   - a chave -2023 EXPIROU (2025-10-22) e o apt recusa com EXPKEYSIG.
    #     Ver mysql_chave_url e mysql_chave_expira em group_vars.
    #   - o componente para noble é mysql-{{ mysql_serie }}-lts.
    - name: MySQL {{ mysql_serie }}
      tags: [mysql]
      block:

        - name: Chave do repositório do MySQL
          ansible.builtin.get_url:
            url: "{{ mysql_chave_url }}"
            dest: /etc/apt/keyrings/mysql.asc
            mode: "0644"
            force: true   # a chave é substituída na renovação, não só criada

        - name: Repositório do MySQL
          ansible.builtin.apt_repository:
            repo: >-
              deb [signed-by=/etc/apt/keyrings/mysql.asc]
              http://repo.mysql.com/apt/ubuntu
              {{ ansible_distribution_release }} mysql-{{ mysql_serie }}-lts
            filename: mysql
            state: present
            update_cache: true

        - name: Servidor MySQL
          ansible.builtin.apt:
            name: mysql-server
            state: present

        - name: MySQL habilitado
          ansible.builtin.systemd:
            name: mysql
            enabled: true
            state: started

        - name: Banco da aplicação
          ansible.builtin.command:
            cmd: mysql --protocol=socket -e "CREATE DATABASE IF NOT EXISTS {{ banco_nome }}
                 CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          changed_when: false

        # 🔴 O usuário do banco NÃO existia no playbook. A instância de
        # desenvolvimento funcionava porque ele foi criado à mão. Numa VPS nova o
        # painel e o dialer falhariam na conexão com "Access denied", o que manda a
        # investigação para a senha em vez de para a ausência do usuário.
        #
        # `@localhost` e não `@%`: o banco só é acessado da própria máquina.
        - name: Usuário do banco
          ansible.builtin.command:
            cmd: >-
              mysql --protocol=socket -e
              "CREATE USER IF NOT EXISTS '{{ banco_usuario }}'@'localhost'
                 IDENTIFIED BY '{{ banco_senha }}';
               ALTER USER '{{ banco_usuario }}'@'localhost'
                 IDENTIFIED BY '{{ banco_senha }}';
               GRANT ALL PRIVILEGES ON {{ banco_nome }}.* TO '{{ banco_usuario }}'@'localhost';
               FLUSH PRIVILEGES"
          changed_when: false
          no_log: true   # a senha vai no comando

    # ------------------------------------------------------------------
    # Artefato, não compilação por cliente: versão IDÊNTICA em todas as
    # instâncias, provisionamento rápido, rollback trivial.
    # Gere com build-asterisk.sh e publique.
    - name: Asterisk {{ asterisk_versao }}
      tags: [asterisk]
      block:

        - name: Baixar o pacote do Asterisk
          ansible.builtin.get_url:
            url: "{{ asterisk_url_artefato }}"
            dest: "/tmp/asterisk_{{ asterisk_versao }}_amd64.deb"
            mode: "0644"

        - name: Instalar o Asterisk
          ansible.builtin.apt:
            deb: "/tmp/asterisk_{{ asterisk_versao }}_amd64.deb"
            state: present

        # VERIFICADO POR FALHA: o logger.conf que vem de `make samples` NÃO
        # registra `verbose`, e é aí que o traço de `pjsip set logger`
        # escreve. Sem isto, o diagnóstico de sinalização não existe em
        # arquivo — só no console de quem estiver conectado na hora.
        - name: logger.conf registra verbose
          ansible.builtin.lineinfile:
            path: /etc/asterisk/logger.conf
            regexp: '^messages\.log =>'
            line: "messages.log => notice,warning,error,verbose"
          notify: Recarregar o logger

        # VERIFICADO POR FALHA: `make samples` cria estes diretórios como
        # root, e o Asterisk roda como asterisk. Resultado:
        #   cdr_csv.c: Unable to open file ... Permission denied
        # O CDR falha em silêncio no primeiro CDR gravado.
        # VERIFICADO POR FALHA, DUAS VEZES. `make samples` cria estes
        # diretórios como root e o Asterisk roda como asterisk:
        #   - cdr-csv    -> "Unable to open file ... Permission denied"
        #   - monitor    -> MixMonitor NÃO GRAVA, e falha em SILÊNCIO
        #
        # O segundo é grave: a gravação de chamada existe no v1 porque o
        # falso positivo do AMD só é mensurável ouvindo. Uma permissão de
        # diretório derrubaria o único jeito de medir isso, sem avisar.
        - name: Diretórios de estado do Asterisk com dono correto
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: asterisk
            group: asterisk
            mode: "0750"
          loop:
            - /var/log/asterisk/cdr-csv
            - /var/log/asterisk/cdr-custom
            - /var/log/asterisk/cel-custom
            - /var/spool/asterisk/monitor
            - /var/spool/asterisk/dictate
            - /var/spool/asterisk/meetme

        - name: Diretórios de áudio e gravação
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: asterisk
            group: asterisk
            mode: "0750"
          loop:
            - "{{ audio_dir }}"
            - "{{ gravacao_dir }}"

        # MEDIDO: Playback em arquivo ausente devolve PLAYBACKSTATUS=FAILED
        # e o dialplan CONTINUA. O Lead ouve silêncio e o fluxo segue como se
        # nada tivesse acontecido. Por isso esta verificação falha o playbook:
        # instância sem os áudios de sistema não roda Campanha.
        - name: Instalar os áudios de sistema
          ansible.builtin.copy:
            src: "../audios/{{ item }}.alaw"
            dest: "{{ audio_dir }}/{{ item }}.alaw"
            owner: asterisk
            group: asterisk
            mode: "0640"
          loop: "{{ audios_sistema }}"

        - name: Conferir formato dos áudios de sistema
          ansible.builtin.command:
            cmd: "soxi -c -r {{ audio_dir }}/{{ item }}.alaw"
          register: fmt_audio
          changed_when: false
          loop: "{{ audios_sistema }}"
          failed_when: >-
            fmt_audio.rc != 0
            or '1' not in fmt_audio.stdout_lines
            or '8000' not in fmt_audio.stdout_lines

        - name: Configuração do tronco
          ansible.builtin.template:
            src: templates/pjsip-tronco.conf.j2
            dest: /etc/asterisk/pjsip.conf
            owner: asterisk
            group: asterisk
            mode: "0640"
          notify: Recarregar o pjsip

        # O elo entre o dialer e o fastagi. Sem este contexto o Asterisk recusa
        # o Originate — e a recusa vem SEM evento nenhum depois, então o Lead
        # ficaria parado sem diagnóstico. Ver o tratamento da resposta em
        # bin/dialer.php.
        - name: Dialplan de produção
          ansible.builtin.template:
            src: templates/extensions.conf.j2
            dest: /etc/asterisk/extensions.conf
            owner: asterisk
            group: asterisk
            mode: "0640"
          notify: Recarregar o dialplan

        # O `dialer` fala AMI. Esta dependência não existia no provisionamento
        # até o dialer existir — sem manager.conf habilitado ele não conecta.
        - name: Interface de gerência (AMI) para o dialer
          ansible.builtin.template:
            src: templates/manager.conf.j2
            dest: /etc/asterisk/manager.conf
            owner: asterisk
            group: asterisk
            mode: "0640"
          notify: Recarregar o manager

        - name: Faixa de portas RTP
          ansible.builtin.template:
            src: templates/rtp.conf.j2
            dest: /etc/asterisk/rtp.conf
            owner: asterisk
            group: asterisk
            mode: "0640"
          notify: Recarregar o RTP

        - name: Asterisk habilitado
          ansible.builtin.systemd:
            name: asterisk
            enabled: true
            state: started

    # ------------------------------------------------------------------
    - name: Avisar quando a instância roda sem HTTPS
      tags: [deploy, https]
      when: not (https_ativo | bool)
      ansible.builtin.debug:
        msg: >-
          `dominio` é um IP ({{ dominio }}), então NÃO há HTTPS: o certbot não
          emite certificado para IP. O .env sai com SESSION_SECURE_COOKIE=false
          para o login funcionar em HTTP. Isto serve para teste — em produção
          aponte um nome de domínio para esta máquina e rode o playbook de novo.

    # ------------------------------------------------------------------
    # 🔴 A APLICAÇÃO. Este bloco não existia: o playbook provisionava a máquina e
    # nunca entregava o código, então as unidades subiam apontando para arquivos
    # ausentes e o painel não tinha o que servir. Ver #26.
    #
    # Vem ANTES do bloco de unidades de propósito: habilitar serviço cujo script
    # não existe produz ciclo de falha permanente no journal.
    - name: Aplicação
      tags: [deploy]
      block:

        # Assets vêm PRONTOS da máquina de controle. Node não é instalado na VPS:
        # nodejs + npm + node_modules é peso considerável para produzir dois
        # arquivos estáticos que nunca mudam entre clientes.
        - name: Manifesto dos assets na máquina de controle
          delegate_to: localhost
          become: false
          run_once: true
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/../public/build/manifest.json"
          register: manifesto_assets

        # Falha AQUI, e não em tempo de requisição. Sem o manifesto, `@vite` lança
        # exceção quando o operador abre o painel — implantação "bem-sucedida" com
        # produto quebrado, e a mensagem não diz que faltou um passo de build.
        - name: Exigir os assets construídos
          delegate_to: localhost
          become: false
          run_once: true
          ansible.builtin.fail:
            msg: >-
              public/build/manifest.json não existe. Rode `npm ci && npm run build`
              na máquina de controle antes do playbook — node não é instalado na
              VPS de propósito, então o artefato precisa vir pronto.
          when: not manifesto_assets.stat.exists

        # `tar` e `unarchive` porque só há ansible.builtin nesta instalação: nem
        # community.general nem ansible.posix estão presentes, então `synchronize`
        # não é opção.
        - name: Montar o artefato da aplicação
          delegate_to: localhost
          become: false
          run_once: true
          ansible.builtin.command:
            chdir: "{{ playbook_dir }}/.."
            cmd: >-
              tar czf {{ artefato_local }}
              --exclude=./.git
              --exclude=./node_modules
              --exclude=./vendor
              --exclude=./.env
              --exclude=./tests
              --exclude=./provisionamento
              --exclude=./storage/logs
              --exclude=./storage/framework/cache
              --exclude=./storage/framework/sessions
              --exclude=./storage/framework/views
              .
          changed_when: true

        # 0755, não 0750. O nginx roda como www-data e precisa ATRAVESSAR o
        # diretório e ler `public/` para servir os assets. Com 0750 de
        # prospecta:prospecta o CSS e o JS voltariam 403, e a página chegaria sem
        # estilo nenhum — sintoma que não sugere permissão.
        #
        # O código não é segredo. O segredo é o `.env`, e ele fica 0640 mais
        # abaixo, legível só pelo php-fpm, que agora roda como a aplicação.
        - name: Diretório da aplicação
          ansible.builtin.file:
            path: "{{ app_dir }}"
            state: directory
            owner: "{{ app_usuario }}"
            group: "{{ app_usuario }}"
            mode: "0755"

        # LIMITAÇÃO CONHECIDA: `unarchive` sobrepõe, não sincroniza — arquivo
        # removido do repositório permanece na VPS. Para o v1 é aceitável porque
        # nada no produto varre diretório em busca de código. Se isso mudar, este
        # passo precisa apagar antes de extrair.
        - name: Enviar e extrair o código
          ansible.builtin.unarchive:
            src: "{{ artefato_local }}"
            dest: "{{ app_dir }}"
            owner: "{{ app_usuario }}"
            group: "{{ app_usuario }}"

        # 🔴 ANTES do composer, e a ordem é o conserto de uma falha real.
        #
        # `composer install` dispara `artisan package:discover`, que precisa de
        # `storage/framework/views`. O `tar --exclude` acima remove o DIRETÓRIO, não
        # só o conteúdo — a intenção era não enviar cache de desenvolvimento, e o
        # efeito foi entregar uma árvore sem os diretórios de estado. O composer
        # morria com "Please provide a valid cache path.", mensagem que não diz que
        # falta um diretório nem qual.
        - name: Esqueleto de diretórios de estado
          ansible.builtin.file:
            path: "{{ app_dir }}/{{ item }}"
            state: directory
            owner: "{{ app_usuario }}"
            group: "{{ app_usuario }}"
            mode: "0755"
          loop:
            - storage
            - storage/app
            - storage/app/private
            - storage/app/public
            - storage/framework
            - storage/framework/cache
            - storage/framework/cache/data
            - storage/framework/sessions
            - storage/framework/views
            - storage/logs
            - bootstrap/cache

        - name: Composer
          ansible.builtin.apt:
            name: composer
            state: present

        # Roda como root e o dono é corrigido depois. `become_user` para uma conta
        # com shell nologin é mais superfície de falha do que o chown resolve.
        - name: Dependências de produção
          ansible.builtin.command:
            chdir: "{{ app_dir }}"
            cmd: >-
              composer install --no-dev --optimize-autoloader
              --no-interaction --no-progress
          environment:
            COMPOSER_ALLOW_SUPERUSER: "1"
          changed_when: true

        # 🔴 O php-fpm passa a rodar como a conta da aplicação.
        #
        # O pool padrão roda como www-data, e as unidades do systemd rodam como
        # `app_usuario`. Com duas identidades, o painel não leria o `.env` (0640) nem
        # escreveria em `storage/` — e o sintoma seria 500 na primeira requisição,
        # com "Permission denied" num caminho de cache que não sugere a causa.
        #
        # Uma identidade só é mais simples que compartilhar grupo entre as duas.
        # 🔴 DUAS identidades diferentes aqui, e confundi-las dá 502.
        #
        # `user`/`group`  = quem EXECUTA o PHP. Tem que ser a aplicação, senão o
        #                   painel não lê o .env (0640) nem escreve em storage/.
        # `listen.*`      = quem pode CONECTAR no socket. Tem que ser o nginx.
        #
        # Pus `listen.owner = prospecta` na primeira versão e o nginx passou a
        # receber "Permission denied" no socket: 502 em toda página PHP, enquanto os
        # assets estáticos continuavam 200 — o que faz parecer problema de PHP, não
        # de permissão de socket. Medido nesta máquina.
        - name: Pool do php-fpm — identidade de execução e do socket
          ansible.builtin.lineinfile:
            path: "/etc/php/{{ php_versao }}/fpm/pool.d/www.conf"
            regexp: "^{{ item.chave }} *="
            line: "{{ item.chave }} = {{ item.valor }}"
          loop:
            - {chave: "user", valor: "{{ app_usuario }}"}
            - {chave: "group", valor: "{{ app_usuario }}"}
            - {chave: "listen.owner", valor: "{{ nginx_usuario }}"}
            - {chave: "listen.group", valor: "{{ nginx_usuario }}"}
          notify: Reiniciar o php-fpm

        - name: Configuração de execução (.env)
          ansible.builtin.template:
            src: templates/env.j2
            dest: "{{ app_dir }}/.env"
            owner: "{{ app_usuario }}"
            group: "{{ app_usuario }}"
            mode: "0640"
          no_log: true   # o arquivo tem senha de banco e segredo do AMI

        # O composer roda como root, então `vendor/` nasce de root. Sem isto o
        # `artisan optimize` não escreveria o cache e o painel falharia na primeira
        # requisição — como usuário da aplicação, não como root.
        - name: Dono do código
          ansible.builtin.file:
            path: "{{ app_dir }}"
            state: directory
            owner: "{{ app_usuario }}"
            group: "{{ app_usuario }}"
            recurse: true

        - name: Migrações
          ansible.builtin.command:
            chdir: "{{ app_dir }}"
            cmd: "php{{ php_versao }} artisan migrate --force --no-interaction"
          register: migracoes
          changed_when: "'Nothing to migrate' not in migracoes.stdout"

        # Cache de configuração, rota e view. Seguro aqui porque os processos de
        # chamada NÃO leem a configuração pelo framework: `config/dialer.php` e
        # `config/fastagi.php` são lidos direto, com getenv (ADR-0001).
        - name: Otimizar o framework
          ansible.builtin.command:
            chdir: "{{ app_dir }}"
            cmd: "php{{ php_versao }} artisan optimize"
          changed_when: true

        # 🔴 DESCARREGAR OS HANDLERS ANTES DO PORTÃO ABAIXO.
        #
        # O Ansible executa handlers no fim da play, e NÃO os executa para um host
        # que falhou. Como a checagem de operador abaixo falha de propósito numa
        # instância nova, o reinício do php-fpm ficava pendente para sempre.
        #
        # E o modo de falhar é traiçoeiro: o arquivo do pool já dizia
        # `user = prospecta` — então quem inspecionasse concluiria que estava
        # aplicado — enquanto os workers continuavam como www-data. Na execução
        # seguinte a task sai `ok`, sem mudança e sem notificar o handler, então o
        # reinício NUNCA aconteceria. Medido nesta máquina.
        - name: Aplicar reinícios pendentes antes de checar o operador
          ansible.builtin.meta: flush_handlers

        # 🔴 Sem operador, ninguém entra — e isso NÃO é implantação concluída.
        #
        # O comando não é rodado pelo playbook de propósito: `--senha` colocaria a
        # senha em host_vars, num arquivo no disco da máquina de controle e no
        # `ps` da VPS. O modo interativo pede sem eco, e é uma vez por instância.
        - name: Contar operadores cadastrados
          ansible.builtin.command:
            cmd: "mysql --protocol=socket -N -B {{ banco_nome }} -e \"SELECT COUNT(*) FROM users\""
          register: operadores
          changed_when: false

        - name: Exigir um operador cadastrado
          ansible.builtin.fail:
            msg: >-
              Nenhum operador cadastrado — o painel está de pé e ninguém consegue
              entrar. Rode na VPS, uma vez:
              sudo -u {{ app_usuario }} php{{ php_versao }} {{ app_dir }}/artisan
              prospecta:operador seu@email.com
              A senha é pedida sem eco; mínimo de 12 caracteres.
          when: operadores.stdout | trim | int == 0

    # ------------------------------------------------------------------
    - name: Unidades do Prospecta
      tags: [app]
      block:

        - name: Unidades do systemd
          ansible.builtin.template:
            src: "templates/{{ item }}.j2"
            dest: "/etc/systemd/system/{{ item }}"
            mode: "0644"
          loop:
            - prospecta-fastagi.socket
            - prospecta-fastagi@.service
            - prospecta-dialer.service
            - prospecta-worker.service
            - prospecta-expurgo.service
            - prospecta-expurgo.timer
          notify: Recarregar o systemd

        - name: Socket do FastAGI habilitado
          ansible.builtin.systemd:
            name: prospecta-fastagi.socket
            enabled: true
            state: started
            daemon_reload: true

        # dialer e worker são serviços PERSISTENTES, não cron.
        #
        # O worker voltou para esta lista: ele estava fora porque `bin/worker.php`
        # não existia e a unidade entraria em ciclo de falha com "No such file or
        # directory". O script existe agora.
        #
        # O ADR-0005 trocou o ritmo da discagem para malha fechada, e taxa
        # realimentada quer processo contínuo. Efeito colateral bom: o systemd
        # garante instância única, então a trava de arquivo deixa de ser
        # necessária — e no worker isso é o que permite reivindicar Ação sem
        # travar linha de Lead.
        # O ADR-0005 trocou o ritmo para malha fechada, e taxa realimentada
        # quer processo contínuo. Efeito colateral bom: o systemd garante
        # instância única, então a trava de arquivo deixa de ser necessária.
        - name: Serviços persistentes habilitados
          ansible.builtin.systemd:
            name: "{{ item }}"
            enabled: true
            state: started
            daemon_reload: true
          loop:
            - prospecta-dialer.service
            - prospecta-worker.service

        - name: Temporizador de expurgo de gravação habilitado
          ansible.builtin.systemd:
            name: prospecta-expurgo.timer
            enabled: true
            state: started
            daemon_reload: true

    # ------------------------------------------------------------------
    - name: Servidor web
      tags: [web]
      block:

        - name: Site do nginx
          ansible.builtin.template:
            src: templates/nginx-prospecta.conf.j2
            dest: /etc/nginx/sites-available/prospecta
            mode: "0644"
          notify: Recarregar o nginx

        - name: Habilitar o site
          ansible.builtin.file:
            src: /etc/nginx/sites-available/prospecta
            dest: /etc/nginx/sites-enabled/prospecta
            state: link
          notify: Recarregar o nginx

        - name: Remover o site padrão
          ansible.builtin.file:
            path: /etc/nginx/sites-enabled/default
            state: absent
          notify: Recarregar o nginx

    # ------------------------------------------------------------------
    # PRÉ-REQUISITO: o DNS de {{ dominio }} tem que resolver para o IP
    # desta máquina. A validação é por HTTP.
    #
    # Certificado válido não é conforto: a Meta RECUSA autoassinado, então
    # sem isto o webhook do WhatsApp não pode ser cadastrado (#24).
    #
    # Se o DNS ainda não propagou: --skip-tags https, e volte depois.
    # Condicionado a `dominio` ser um NOME: o certbot RECUSA endereço IP, e com o
    # `creates:` abaixo a task falharia em toda execução do playbook numa instância
    # acessada por IP. Ver `https_ativo` em group_vars/all.yml.
    - name: HTTPS
      tags: [https]
      when: https_ativo | bool
      block:

        - name: Certbot
          ansible.builtin.apt:
            name:
              - certbot
              - python3-certbot-nginx
            state: present

        - name: Emitir o certificado
          ansible.builtin.command:
            cmd: >-
              certbot --nginx --non-interactive --agree-tos
              -m {{ email_certificado }} -d {{ dominio }}
            creates: "/etc/letsencrypt/live/{{ dominio }}/fullchain.pem"

  handlers:

    - name: Recarregar o systemd
      ansible.builtin.systemd:
        daemon_reload: true

    # VERIFICADO POR FALHA: `core reload` NÃO reaplica objeto de configuração
    # do pjsip. O qualify_frequency novo ficou como NonQual e o endpoint como
    # Unavailable até rodar `pjsip reload` explicitamente. Handler genérico de
    # reload é armadilha: cada subsistema tem o seu.
    - name: Recarregar o logger
      ansible.builtin.command:
        cmd: asterisk -rx "logger reload"
      changed_when: true

    - name: Recarregar o dialplan
      ansible.builtin.command:
        cmd: asterisk -rx "dialplan reload"
      changed_when: true

    - name: Recarregar o manager
      ansible.builtin.command:
        cmd: asterisk -rx "manager reload"
      changed_when: true

    - name: Recarregar o pjsip
      ansible.builtin.command:
        cmd: asterisk -rx "pjsip reload"
      changed_when: true

    - name: Recarregar o RTP
      ansible.builtin.command:
        cmd: asterisk -rx "module reload res_rtp_asterisk.so"
      changed_when: true

    - name: Reiniciar o php-fpm
      ansible.builtin.systemd:
        name: "php{{ php_versao }}-fpm"
        state: restarted

    - name: Recarregar o nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
